<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejemplo de Tabla Sencilla</title>
    <style>
        table {
            width: 100%;
            border-collapse: collapse;
            font-family: Arial, sans-serif;
        }
        th, td {
            border: 1px solid #dddddd;
            text-align: left;
            padding: 8px;
        }
        th {
            background-color: #f2f2f2;
        }
    </style>
</head>
<body>

    <h2>Lista de Productos</h2>

    <table>
        <tr>
            <th>Producto</th>
            <th>Categoría</th>
            <th>Precio</th>
        </tr>
        <tr>
            <td>Manzana</td>
            <td>Fruta</td>
            <td>$1.20</td>
        </tr>
        <tr>
            <td>Zanahoria</td>
            <td>Verdura</td>
            <td>$0.80</td>
        </tr>
        <tr>
            <td>Leche</td>
            <td>Lácteos</td>
            <td>$2.50</td>
        </tr>
    </table>

</body>
</html>
